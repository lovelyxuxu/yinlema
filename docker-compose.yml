# =============================================================================
# 瘾了吗（yinlema）子项目编排文件
#
# 生产模式：加入共享网络 bolt_net，主站 nginx 通过容器名 yinlema-backend:8000 访问。
# 前端：cd web && npm run build → Nginx 挂载 /var/www/yinlema/
# =============================================================================

name: yinlema

services:

  yinlema-mongo:
    image: mongo:7
    container_name: yinlema-mongo
    restart: unless-stopped
    volumes:
      - yinlema-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  yinlema-backend:
    build:
      context: ./serve
      dockerfile: Dockerfile
    container_name: yinlema-backend
    restart: unless-stopped
    env_file:
      - ./serve/.env
    environment:
      MONGODB_URL: mongodb://yinlema-mongo:27017
    depends_on:
      yinlema-mongo:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - default
      - bolt_net

volumes:
  yinlema-mongo-data:
    driver: local

networks:
  bolt_net:
    external: true
    name: bolt_net
